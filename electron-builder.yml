appId: com.local.video-scraper
# 不设 productName：Electron 的 app.getName() 会取它，进而决定 userData 目录名。
# 保持包名 video-scraper，userData 才仍是 %APPDATA%\video-scraper（与开发态、
# 与已有的登录态/数据库目录一致）。友好中文名只体现在产物文件名上（见 portable.artifactName）。

directories:
  output: dist

# 只打运行时真正需要的：out/ 产物 + package.json + 唯一的外部运行时依赖 sherpa。
# react/react-dom 已被 vite 打进 renderer bundle，不必随包（实测 out/ 里只有
# asr-worker.js require('sherpa-onnx-node')，其余全是 node: 内置模块与 electron）。
files:
  - out/**/*
  - package.json
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-win-x64/**/*

# 原生模块（.node / .dll）在 asar 里无法 dlopen，必须解包到 app.asar.unpacked
asarUnpack:
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-win-x64/**

# ffmpeg 随包，落到 <resourcesPath>/ffmpeg/bin/。
# 该布局正好命中 src/main/ffbin.ts 里 findInRoots 的 <root>/ffmpeg<版本>/bin/ 规则，
# 且随包的这份优先于机器上的任意版本。不带 ffplay.exe（用不到，省 97MB）。
# 打包前先把 ffmpeg.exe / ffprobe.exe 放进 vendor/ffmpeg/bin/（不进 git），
# `npm run dist` 会先跑 scripts/prepare-ffmpeg.mjs 检查；也可以设环境变量 FFMPEG_BIN_DIR 让脚本自动复制。
extraResources:
  - from: vendor/ffmpeg/bin/ffmpeg.exe
    to: ffmpeg/bin/ffmpeg.exe
  - from: vendor/ffmpeg/bin/ffprobe.exe
    to: ffmpeg/bin/ffprobe.exe
  # 项目许可与第三方许可独立放在 resources/licenses，运行时组件仍遵守各自条款。
  - from: third_party/licenses
    to: licenses
  - from: LICENSE
    to: licenses/PROJECT-LICENSE.txt
  - from: LICENSE.zh-CN.md
    to: licenses/PROJECT-LICENSE.zh-CN.md
  - from: NOTICE
    to: licenses/NOTICE.txt
  - from: TRADEMARKS.md
    to: licenses/TRADEMARKS.md

win:
  # 应用图标。不设时 electron-builder 用 Electron 默认图标（构建日志会提示
  # "default Electron icon is used"），任务栏/桌面上看到的是 Electron 的原子标。
  # 源文件是 1254x1254 PNG，electron-builder 自行转成多尺寸 .ico 嵌进 EXE。
  icon: build/icon.png
  target:
    - target: portable
      arch:
        - x64

portable:
  # 用 ASCII 文件名产出，避免打包链路上的编码问题；交付前再改成中文名即可
  artifactName: video-scraper-${version}-portable.exe
